min_version = "2025.1.0"

[tools]
node = "26.13.1"
bun = "1.4.5"
pitchfork = "2.35.0"
# The linters the shared hk pre-push hook runs.
uv = "0.13.9"
# yamllint's PyYAML has no wheels for Python 3.15 yet, which mise lock needs.
python = "3.14.10"
"pipx:yamllint" = "1.38.0"
"npm:markdownlint-cli2" = "0.24.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.install]
description = "Install CLI dependencies"
run = "bun install"

[tasks.build]
description = "Compile the momentum binary"
depends = ["install"]
run = "bun run build"

[tasks.test]
description = "Run CLI tests"
depends = ["install"]
run = "bun run test"

[tasks.typecheck]
description = "Type-check the CLI"
depends = ["install"]
run = "bun run typecheck"

[tasks.lint]
description = "Lint the CLI with the shared Oxlint rules"
depends = ["install"]
run = "bun run lint"

[tasks.format]
description = "Format the CLI source"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check CLI formatting"
depends = ["install"]
run = "bun run format:check"

[tasks.validate]
description = "Validate the Omarchy plugin manifest"
# node_modules holds symlinks the validator refuses, so check the files git
# would ship, as an installed checkout has them.
run = '''
dir=$(mktemp -d)
trap 'rm -rf "$dir"' EXIT
git ls-files -z --cached --others --exclude-standard | xargs -0 cp --parents -t "$dir"
omarchy plugin validate "$dir"
'''

[tasks."lint:qml"]
description = "Lint the plugin QML"
run = "qmllint -I /usr/lib/qt6/qml Panel.qml PanelFlickable.qml PanelHeader.qml SectionHeading.qml Service.qml"

[tasks."docs:install"]
description = "Install docs dependencies"
dir = "docs"
run = "bun install --frozen-lockfile"

[tasks."docs:dev"]
description = "Run the docs dev server"
depends = ["docs:install"]
dir = "docs"
run = "bun run dev"

[tasks."docs:build"]
description = "Build the docs site"
depends = ["docs:install"]
dir = "docs"
run = "bun run build"

[tasks."docs:preview"]
description = "Preview the built docs site"
dir = "docs"
run = "bun run preview"

[tasks."docs:check"]
description = "Check the docs site's pages, links and types without disturbing a running dev server"
depends = ["docs:install"]
dir = "docs"
run = "bun run check -- --isolated"

[tasks."docs:plan"]
description = "Build the docs site, then show what deploying its prod stage would change"
depends = ["docs:build"]
dir = "docs"
run = "bun run plan"

[tasks."docs:deploy"]
description = "Build the docs site, then deploy its prod stage with Alchemy"
depends = ["docs:build"]
dir = "docs"
run = "bun run deploy"

[tasks."docs:deploy:github"]
description = "Mint CI's Cloudflare token into the repository's secrets"
depends = ["docs:install"]
dir = "docs"
run = "bun run deploy:github"

[tasks."serve:docs"]
description = "Start the docs dev server in the background through Pitchfork"
run = "pitchfork start docs"

[tasks."serve:docs:status"]
description = "Show the background docs dev server status"
run = "pitchfork status docs"

[tasks."serve:docs:logs"]
description = "Follow the background docs dev server logs"
run = "pitchfork logs -t docs"

[tasks."serve:docs:restart"]
description = "Restart the background docs dev server"
run = "pitchfork restart docs"

[tasks."serve:docs:stop"]
description = "Stop the background docs dev server"
run = "pitchfork stop docs"

[tasks.check]
description = "Test, lint, type-check and verify formatting of the CLI, and check the docs site"
depends = ["test", "lint", "typecheck", "format:check", "docs:check"]

[tasks."check:plugin"]
description = "Validate the plugin manifest and lint the QML"
depends = ["validate", "lint:qml"]
