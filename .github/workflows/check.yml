---
name: Check

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    container: archlinux:latest@sha256:f3691b4dde62ba4c4b6f0ae2c1fbf28e8c0c8c4b9a35c7e06dc1f70e21aa29f6
    steps:
      - name: Install validation tools
        run: pacman -Syu --noconfirm --needed git jq quickshell qt6-declarative
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check manifest
        run: |
          git clone --depth 1 --branch quattro https://github.com/basecamp/omarchy.git "$RUNNER_TEMP/omarchy"
          OMARCHY_PATH="$RUNNER_TEMP/omarchy" "$RUNNER_TEMP/omarchy/bin/omarchy-plugin-validate" .
      - name: Lint QML
        run: |
          export PATH="/usr/lib/qt6/bin:$PATH"
          qmllint -I /usr/lib/qt6/qml Panel.qml Service.qml
