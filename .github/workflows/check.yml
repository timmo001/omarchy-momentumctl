---
name: Check

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    container: archlinux:latest@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
    steps:
      - name: Install validation tools
        run: pacman -Syu --noconfirm --needed git jq quickshell qt6-declarative
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check manifest
        run: |
          git clone --depth 1 --branch quattro https://github.com/omacom/omarchy.git "$RUNNER_TEMP/omarchy"
          OMARCHY_PATH="$RUNNER_TEMP/omarchy" "$RUNNER_TEMP/omarchy/bin/omarchy-plugin-validate" .
      - name: Lint QML
        run: |
          export PATH="/usr/lib/qt6/bin:$PATH"
          qmllint -I /usr/lib/qt6/qml Panel.qml PanelFlickable.qml PanelHeader.qml SectionHeading.qml Service.qml
