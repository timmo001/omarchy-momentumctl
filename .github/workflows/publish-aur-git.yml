---
name: Publish AUR git package

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - src/**
      - package.json
      - bun.lock
      - mise.toml
      - LICENSE
      - .scripts/linux/PKGBUILD
      - .scripts/linux/prepare-aur.sh
      - .github/workflows/publish-aur-git.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-aur-git-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish AUR (momentum-git)
    uses: timmo001/workflows/.github/workflows/publish-aur.yml@36ba6651f1296cce685ede8ac38b9574c9291028 # master
    with:
      package-name: momentum-git
      prepare-command: .scripts/linux/prepare-aur.sh "$AUR_PACKAGE_DIR"
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
