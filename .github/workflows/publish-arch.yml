---
name: Publish Arch package

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
    paths:
      - PKGBUILD
      - .github/workflows/publish-arch.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-arch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Arch package (momentumctl)
    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@6ed3dc84f0774ea69e508afb26c245e81596cf7b
    with:
      package-name: momentumctl
      pkgbuild-path: PKGBUILD
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}
