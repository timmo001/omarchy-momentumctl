---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/build-bun-cli.yml@f8d0daf26e163f0ee997d759fbf0f7daeb598c43 # 20261008.2
    with:
      smoke-test: |-
        ./dist/momentum --help
        ./dist/momentum --version
